# ===============================================================
# NexT Theme Configuration
# ===============================================================

# Scheme
scheme: Gemini

# Dark Mode
darkmode: true

# Sidebar
sidebar:
  position: left
  display: post
  offset: 12

# Back to top
back2top:
  enable: true
  sidebar: true
  scrollpercent: true

# Reading progress bar
reading_progress:
  enable: true
  start_at: left
  position: top
  color: "#37c6c0"
  height: 3px

# Avatar
avatar:
  url: /images/avatar.gif
  rounded: true

# Footer
footer:
  since: 2016
  icon:
    name: fa fa-user
    animated: false
  copyright: book诗意
  powered: true
  beian:
    enable: true
    icp: 辽ICP备16002243号-2

# GitHub Banner (corner ribbon)
github_banner:
  enable: true
  permalink: https://github.com/bookshiyi

# Motion
motion:
  enable: true
  async: false
  transition:
    post_block: fadeIn
    post_header: slideDownIn
    post_body: slideDownIn
    coll_header: slideLeftIn
    sidebar: fadeInUp

# Local Search
local_search:
  enable: true
  trigger: auto
  top_n_per_article: 1

# Bookmark
bookmark:
  enable: false

# Code block
codeblock:
  theme:
    light: default
    dark: stackoverflow-dark
  copy_button:
    enable: true
    style: flat
  language: true

# Image Lazyload
lazyload: true

# Image Zoom
mediumzoom: true

# Minify (remove unused files)
minify: true

# Related Posts
related_posts:
  enable: true
  icon: fa fa-signs-post

# Post navigation
post_navigation: left

# Tags Cloud (for tags page)
tagcloud:
  min: 12
  max: 30
  amount: 200
  orderby: name
  order: 1

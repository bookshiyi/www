# ===============================================================
# NexT Theme Configuration
# ===============================================================

# Scheme
scheme: Gemini

# Dark Mode
darkmode: true

# Menu
menu:
  home: / || fa fa-home
  archives: /archives/ || fa fa-archive
  categories: /categories/ || fa fa-th
  tags: /tags/ || fa fa-tags

menu_settings:
  icons: true
  badges: false

# Sidebar
sidebar:
  position: left
  display: post
  offset: 12

# Back to top
back2top:
  enable: true
  sidebar: true
  scrollpercent: true

# Reading progress bar
reading_progress:
  enable: true
  start_at: left
  position: top
  color: "#37c6c0"
  height: 3px

# Avatar
avatar:
  url: /images/avatar.gif
  rounded: true

# Footer
footer:
  since: 2016
  icon:
    name: fa fa-user
    animated: false
  copyright: book诗意
  powered: true
  beian:
    enable: true
    icp: 辽ICP备16002243号-2

# GitHub Banner (corner ribbon)
github_banner:
  enable: true
  permalink: https://github.com/bookshiyi

# Social Links
social:
  GitHub: https://github.com/bookshiyi || fab fa-github

# Motion
motion:
  enable: true
  async: false
  transition:
    post_block: fadeIn
    post_header: slideDownIn
    post_body: slideDownIn
    coll_header: slideLeftIn
    sidebar: fadeInUp

# Local Search
local_search:
  enable: true
  trigger: auto
  top_n_per_article: 1

# Bookmark
bookmark:
  enable: false

# Code block
codeblock:
  theme:
    light: default
    dark: stackoverflow-dark
  copy_button:
    enable: true
    style: flat
  language: true

# Image Lazyload
lazyload: true

# Image Zoom
mediumzoom: true

# Minify
minify: true

# Related Posts
related_posts:
  enable: true
  icon: fa fa-signs-post

# Post navigation
post_navigation: left

# Tags Cloud
tagcloud:
  min: 12
  max: 30
  amount: 200
  orderby: name
  order: 1

# Pjax (smooth navigation)
pjax: true

# Font
font:
  enable: true
  host: https://fonts.googleapis.com
  global:
    external: true
    family: Noto Sans SC
    size:
  codes:
    external: true
    family: JetBrains Mono

# Symbols count & reading time
symbols_count_time:
  separated_meta: true
  item_text_total: true

# Busuanzi visitor analytics
busuanzi_count:
  enable: true
  total_visitors: true
  total_visitors_icon: fa fa-user
  total_views: true
  total_views_icon: fa fa-eye
  post_views: true
  post_views_icon: far fa-eye
